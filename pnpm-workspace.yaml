# pnpm already pins itself through packageManager and mise; the daily notice to
# upgrade it is noise.
updateNotifier: false

# pnpm fails the install on any dependency build script not named here. An
# addition is a supply-chain change and gets reviewed as one. unrs-resolver's
# postinstall only fetches a native binding its optional dependencies provide.
allowBuilds:
  unrs-resolver: false

# A compromised release is usually yanked within a day of publication. Waiting
# 1440 minutes before installing any new version steps around that window. This
# is the pnpm default, stated here so a default change does not move it. Stating
# it also makes it strict: the install fails when no version in range is old
# enough, rather than quietly taking the youngest one that is.
minimumReleaseAge: 1440

# xmlhttprequest arrives from a git commit through lightstreamer-client-node; with this
# true, pnpm refuses that transitive git dependency.
blockExoticSubdeps: false
