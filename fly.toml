app = "iss-temporary-fix"
# London: the nearest Fly region to push.lightstreamer.com, one EC2 host in AWS
# eu-west-1 (Dublin) as of 2026-09-26.
primary_region = "lhr"
# Seconds between the stop signal (SIGINT) and SIGKILL; the server saves its buffer on SIGINT.
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "5000"
  SOURCE = "lightstreamer"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "data"
  destination = "/data"
